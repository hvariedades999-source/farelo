<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Teste de Microfone</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Uma coluna, botões grandes para o dedo */
:root{--bg:#f3f4f7;--fg:#16181d;--muted:#5d6370;--card:#fff;--line:#d9dce3;--accent:#d2402f;--ok:#1f8a4c;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121419;--fg:#eceef2;--muted:#9aa0ad;--card:#1b1e25;--line:#2c313b;--accent:#ff6a55;--ok:#4cc38a;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121419;--fg:#eceef2;--muted:#9aa0ad;--card:#1b1e25;--line:#2c313b;--accent:#ff6a55;--ok:#4cc38a;--bad:#ff8a80;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:480px;margin:0 auto;display:grid;gap:20px}
h1{font-size:1.5rem;margin:0}
p{margin:0;color:var(--muted)}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px}
h2{font-size:1.05rem;margin:0}
button,label.btn{display:block;width:100%;text-align:center;font:600 1.05rem system-ui;padding:16px;border-radius:12px;border:0;background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.4}
button:focus-visible,label.btn:focus-within{outline:3px solid var(--fg);outline-offset:2px}
canvas{width:100%;height:80px;background:var(--bg);border-radius:8px}
.st{font-weight:600}.ok{color:var(--ok)}.bad{color:var(--bad)}
audio{width:100%}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
</style>
<main>
<h1>Teste de microfone</h1>
<p>Toque Gravar e permita o microfone quando o Chrome pedir.</p>

<section>
<h2>Teste 1: gravar aqui na página</h2>
<button id="rec">Gravar</button>
<canvas id="wave" width="600" height="80"></canvas>
<p id="s1" class="st">Ainda não testado.</p>
<audio id="a1" controls hidden></audio>
</section>

<section>
<h2>Teste 2: gravar pelo gravador do celular</h2>
<label class="btn">Abrir gravador<input id="cap" type="file" accept="audio/*" capture></label>
<p id="s2" class="st">Ainda não testado.</p>
<audio id="a2" controls hidden></audio>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
let rec=null,stream=null,chunks=[],raf=0;
function msg(el,t,c){el.textContent=t;el.className='st '+(c||'')}
function draw(an){const c=$('wave'),x=c.getContext('2d'),d=new Uint8Array(an.fftSize);
 const col=getComputedStyle(document.documentElement).getPropertyValue('--accent');
 (function f(){an.getByteTimeDomainData(d);x.clearRect(0,0,c.width,c.height);x.strokeStyle=col;x.lineWidth=2;x.beginPath();
 for(let i=0;i<d.length;i++){const X=i/d.length*c.width,Y=d[i]/255*c.height;i?x.lineTo(X,Y):x.moveTo(X,Y)}x.stroke();raf=requestAnimationFrame(f)})()}
$('rec').onclick=async()=>{
 if(rec&&rec.state==='recording'){rec.stop();return}
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw new Error('API indisponível');
  stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const ac=new AudioContext(),an=ac.createAnalyser();ac.createMediaStreamSource(stream).connect(an);draw(an);
  chunks=[];rec=new MediaRecorder(stream);
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{cancelAnimationFrame(raf);stream.getTracks().forEach(t=>t.stop());ac.close();
   $('a1').src=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType}));$('a1').hidden=false;
   $('rec').textContent='Gravar de novo';msg($('s1'),'Funcionou! Toque play para ouvir.','ok')};
  rec.start();$('rec').textContent='Parar';msg($('s1'),'Gravando… fale algo e toque Parar.');
 }catch(e){msg($('s1'),'Bloqueado: '+(e.name||'')+' '+(e.message||''),'bad')}
};
$('cap').onchange=e=>{const f=e.target.files[0];if(!f){msg($('s2'),'Nenhum áudio recebido.','bad');return}
 $('a2').src=URL.createObjectURL(f);$('a2').hidden=false;
 msg($('s2'),'Recebido: '+f.name+' ('+Math.round(f.size/1024)+' KB). Toque play.','ok')};
</script>

</body></html>
